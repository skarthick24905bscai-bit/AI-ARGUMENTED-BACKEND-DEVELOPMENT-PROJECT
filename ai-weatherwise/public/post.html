<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - AI WeatherWise</title>
  <meta name="description" content="Read full meteorological insight article on AI WeatherWise.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar-rail" id="sidebarRail">
      <a href="/index.html" class="brand-icon" title="AI WeatherWise">
        <span>⚡</span>
      </a>

      <ul class="nav-links">
        <li class="nav-item">
          <a href="/dashboard.html" class="nav-btn" data-title="Dashboard" id="navDashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/weather.html" class="nav-btn" data-title="Weather Search" id="navWeather">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/favorites.html" class="nav-btn" data-title="Saved Cities" id="navFavorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/posts.html" class="nav-btn active" data-title="Meteorological Insights" id="navPosts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/admin.html" class="nav-btn" data-title="Admin Console" id="navAdminLink" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          </a>
        </li>
      </ul>

      <div class="nav-spacer"></div>

      <ul class="nav-links">
        <li class="nav-item">
          <button onclick="api.logout()" class="nav-btn" data-title="Sign Out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </li>
      </ul>
    </aside>

    <main class="main-wrapper">
      <header class="top-bar">
        <div class="user-greeting">
          <div class="user-avatar" id="navbarUserAvatar">W</div>
          <div class="user-meta">
            <div class="greeting-sub">Meteorological Article</div>
            <div class="user-name" id="navbarUserName">Climate Knowledge Hub</div>
          </div>
        </div>

        <div class="top-actions">
          <a href="/posts.html" class="btn-secondary">← Back to Insights</a>
        </div>
      </header>

      <div style="padding: 28px 32px; max-width: 900px; margin: 0 auto; width: 100%;" id="singlePostContainer">
        <div id="postAlertContainer"></div>

        <article class="side-card" style="padding: 36px 40px; margin-bottom: 32px;">
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 14px;">
            <span class="badge badge-info" id="postCategoryBadge">General</span>
            <span style="font-size: 13px; color: var(--text-light);" id="postDate">--</span>
            <span style="font-size: 13px; color: var(--text-light);">•</span>
            <span style="font-size: 13px; color: var(--text-light);" id="postViews">-- views</span>
          </div>

          <h1 id="postTitle" style="font-size: 32px; font-weight: 800; line-height: 1.3; margin-bottom: 14px; letter-spacing: -0.5px;">
            Loading article...
          </h1>

          <p id="postSummary" style="font-size: 17px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; font-style: italic; border-left: 3px solid var(--primary); padding-left: 16px;">
            --
          </p>

          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light);">
            <div class="user-avatar" style="width: 38px; height: 38px; font-size: 14px;">AU</div>
            <div>
              <div style="font-size: 14px; font-weight: 700;" id="postAuthor">Author</div>
              <div style="font-size: 12px; color: var(--text-muted);">Atmospheric Science Contributor</div>
            </div>
          </div>

          <div id="postContentBody">
            <!-- Article body rendered here -->
          </div>
        </article>

        <!-- Comments Section -->
        <section class="side-card" style="padding: 32px 36px;">
          <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px;">
            Community Discussion <span id="commentsCount" style="color: var(--text-muted); font-size: 16px;">(0)</span>
          </h2>

          <div id="commentAlertContainer"></div>

          <!-- Existing Comments List -->
          <div id="commentsList" style="margin-bottom: 28px;">
            <!-- Rendered by posts.js -->
          </div>

          <!-- Add Comment Form -->
          <div id="commentAuthPrompt" style="display: none; padding: 20px; background: var(--bg-subtle); border-radius: var(--radius-md); text-align: center;">
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Sign in to join the conversation and post a comment.</p>
            <a href="/login.html" class="btn-secondary">Sign In</a>
          </div>

          <form id="commentForm">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 10px;">Leave a Comment</h3>
            <div class="form-group">
              <textarea id="commentContentInput" class="form-textarea" placeholder="Share your thoughts on this meteorological analysis..." required></textarea>
            </div>
            <button type="submit" class="btn-primary-action" style="width: auto; padding: 10px 24px;">Post Comment</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
