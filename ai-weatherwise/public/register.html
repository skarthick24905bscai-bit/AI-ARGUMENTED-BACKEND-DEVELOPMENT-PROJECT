<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AI WeatherWise</title>
  <meta name="description" content="Register an account on AI WeatherWise to save favorites and receive Gemini weather insights.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/index.html" class="brand-icon" style="margin-bottom: 0;">
          <span>⚡</span>
        </a>
        <div>
          <h1 class="auth-title">AI WeatherWise</h1>
          <p style="font-size: 13px; color: var(--text-muted);">Intelligent Climate Companion</p>
        </div>
      </div>

      <h2 style="font-size: 19px; font-weight: 700; margin-bottom: 6px;">Create your account</h2>
      <p class="auth-subtitle">Join AI WeatherWise to personalize your weather experience.</p>

      <div id="alertContainer"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Alex Mercer" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. alex@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="role" class="form-label">Account Type</label>
          <select id="role" class="form-select">
            <option value="reader">Standard Reader</option>
            <option value="admin">Administrator (Full Access)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary-action" style="margin-top: 18px;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
