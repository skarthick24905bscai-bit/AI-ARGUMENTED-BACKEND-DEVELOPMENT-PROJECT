<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteorological Insights - AI WeatherWise</title>
  <meta name="description" content="Discover climate science, atmospheric phenomena analysis, and meteorological intelligence articles.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar-rail" id="sidebarRail">
      <a href="/index.html" class="brand-icon" title="AI WeatherWise">
        <span>⚡</span>
      </a>

      <ul class="nav-links">
        <li class="nav-item">
          <a href="/dashboard.html" class="nav-btn" data-title="Dashboard" id="navDashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/weather.html" class="nav-btn" data-title="Weather Search" id="navWeather">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/favorites.html" class="nav-btn" data-title="Saved Cities" id="navFavorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/posts.html" class="nav-btn active" data-title="Meteorological Insights" id="navPosts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
          </a>
        </li>
        <li class="nav-item">
          <a href="/admin.html" class="nav-btn" data-title="Admin Console" id="navAdminLink" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          </a>
        </li>
      </ul>

      <div class="nav-spacer"></div>

      <ul class="nav-links">
        <li class="nav-item">
          <button onclick="api.logout()" class="nav-btn" data-title="Sign Out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </li>
      </ul>
    </aside>

    <main class="main-wrapper">
      <header class="top-bar">
        <div class="user-greeting">
          <div class="user-avatar" id="navbarUserAvatar">W</div>
          <div class="user-meta">
            <div class="greeting-sub">Meteorological Insights</div>
            <div class="user-name" id="navbarUserName">Climate Knowledge Hub</div>
          </div>
        </div>

        <div class="search-container">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="postSearchInput" class="search-input" placeholder="Search insights by topic or tag..." />
          </div>
        </div>
      </header>

      <div style="padding: 28px 32px; max-width: 1400px; margin: 0 auto; width: 100%;">
        <!-- Category Filter Pills -->
        <div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 24px;" id="categoryFilters">
          <button class="toggle-pill-btn active">All Categories</button>
        </div>

        <!-- Posts Grid -->
        <div class="posts-grid" id="postsListContainer">
          <!-- Loaded by posts.js -->
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
